services:
  redis:
    image: redis:7-alpine
    container_name: rexion_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rexion_internal

  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: rexion_ml_service
    restart: unless-stopped
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - rexion_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rexion_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - rexion_internal

  linkedin-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rexion_linkedin_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    entrypoint: ["dumb-init", "--"]
    command: ["node", "src/linkedin-agent/worker.js"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rexion_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rexion_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rexion_internal

volumes:
  redis_data:

networks:
  rexion_internal:
    driver: bridge
